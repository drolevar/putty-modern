# Builds the repository from a clean checkout and runs the unit tests; also publishes the NativeAOT build as an artifact.
#
# What it does not run: the end-to-end checks of the real app (tools/app-*-smoke.ps1). They drive the app with
# UI Automation and real input and run in Windows Sandbox (tools/run-in-sandbox.ps1), which hosted runners do not have.
#
# NOT YET RUN: written on a machine from which nothing may be pushed, so the first run on GitHub is the first test of it.
# What can go wrong on a hosted runner, in the order I would look: the .NET SDK in global.json (11.0.100) being offered by
# setup-dotnet; Visual Studio's C++ x64 tools and its bundled CMake and Ninja (build/native.cmd finds them with vswhere);
# the Windows SDK 10.0.26100 the WinUI projects target; Node for the SSH tests (they are inconclusive, not failed, without it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out, with PuTTY's source (the external/putty submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: .NET SDK (the version global.json pins)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Node (for the test SSH server)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: The test SSH server's package (ssh2)
        shell: pwsh
        run: ./tools/start-ssh-test-server.ps1 -Install

      - name: Build (the native engine through CMake and Ninja, then the managed projects)
        run: dotnet build PuTTY.slnx -c Release

      - name: Unit tests
        run: dotnet test --solution PuTTY.slnx -c Release

      - name: Publish the NativeAOT build
        run: dotnet publish src/PuTTY.App -c Release -r win-x64

      - name: Keep the NativeAOT build
        uses: actions/upload-artifact@v4
        with:
          name: PuTTY.App-win-x64
          path: artifacts/publish/PuTTY.App/release_win-x64/
          retention-days: 14
