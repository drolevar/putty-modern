# Builds the repository from a clean checkout and runs the unit tests; also publishes the NativeAOT build as an artifact.
#
# What it does not run: the end-to-end checks of the real app (tools/app-*-smoke.ps1). They drive the app with
# UI Automation and real input and run in Windows Sandbox (tools/run-in-sandbox.ps1), which hosted runners do not have.
#
# Status: green since its first run (2026-11-12), about five minutes. The first run needed no change: setup-dotnet found the
# SDK pinned in global.json (11.0.100), the runner has Visual Studio's C++ x64 tools with the bundled CMake and Ninja that
# build/native.cmd finds with vswhere, and the Windows SDK 10.0.26100. Node serves the SSH tests (they are inconclusive, not
# failed, without it); the serial data test is inconclusive on a runner (no serial pair).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out, with PuTTY's source (the external/putty submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: .NET SDK (the version global.json pins)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Node (for the test SSH server)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: The test SSH server's package (ssh2)
        shell: pwsh
        run: ./tools/start-ssh-test-server.ps1 -Install

      - name: Build (the native engine through CMake and Ninja, then the managed projects)
        run: dotnet build PuTTY.slnx -c Release

      - name: Unit tests
        run: dotnet test --solution PuTTY.slnx -c Release --output Detailed

      - name: Publish the NativeAOT build
        run: dotnet publish src/PuTTY.App -c Release -r win-x64

      - name: Keep the NativeAOT build
        uses: actions/upload-artifact@v4
        with:
          name: PuTTY.App-win-x64
          path: artifacts/publish/PuTTY.App/release_win-x64/
          retention-days: 14
